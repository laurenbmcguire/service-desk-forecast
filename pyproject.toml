[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deskcast"
version = "0.1.0"
description = "Forecast IT service desk ticket demand, predict SLA breaches and right-size staffing with Erlang C."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lauren McGuire" }]
keywords = ["forecasting", "itsm", "service-desk", "erlang-c", "sla"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
deskcast = "deskcast.cli:main"

[project.urls]
Homepage = "https://github.com/laurenbmcguire/service-desk-forecast"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
