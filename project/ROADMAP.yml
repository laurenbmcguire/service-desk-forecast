# Roadmap for the Service Desk Forecast portfolio project.
# Read by the AI PM (python -m deskcast pm). Status: done | in_progress | planned.
project: Service Desk Forecast

milestones:
  - id: M1
    name: Synthetic ticket generator
    due: 2026-09-18
    status: done
    done_criteria: 18 months of seeded hourly arrivals with weekday/hour seasonality, holidays and incident surges; resolution times driven by category, priority and queue load
  - id: M2
    name: Forecast backtest
    due: 2026-10-02
    status: done
    done_criteria: Rolling-origin backtest (6 x 28 days) with MAE/MAPE for seasonal naive vs calendar-feature ridge; 28-day forecast with residual-quantile intervals
  - id: M3
    name: SLA breach model
    due: 2026-10-16
    status: done
    done_criteria: Gradient boosting on creation-time features plus queue length; time-based split; ROC AUC, precision@top10% and permutation importance reported
  - id: M4
    name: Staffing model
    due: 2026-10-30
    status: done
    done_criteria: Erlang C agents per hour for 80/20 with occupancy cap; typical-week heatmap from the forecast
  - id: M5
    name: Interval calibration and drift monitoring
    due: 2026-11-20
    status: in_progress
    done_criteria: Horizon-aware interval calibration and an automated drift check that flags when live MAPE exceeds the backtest by 30%
  - id: M6
    name: ServiceNow / Jira export connector
    due: 2026-12-18
    status: planned
    done_criteria: Read-only export adapter that maps ServiceNow incident and Jira Service Management fields onto the deskcast ticket schema, with timestamp validation
  - id: M7
    name: Power BI dashboard
    due: 2027-01-29
    status: planned
    done_criteria: Star-schema CSV export and a Power BI report with forecast, SLA risk and staffing pages

